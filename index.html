<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Viewer Example</title>
</head>
<body>

    <h2>My Web Page</h2>
    
    <!-- The link points to the iframe's name attribute -->
    <p>
        <a href="https://jcw87.github.io/c2-sans-fight/" target="contentViewer">Open Example Website in Viewer</a>
    </p>

    <!-- The viewer (iframe) -->
    <div style="margin-top: 20px;">
        <iframe name="contentViewer" width="100%" height="400px" style="border: 1px solid #ccc;">
            Your browser does not support iframes.
        </iframe>
    </div>

</body>
</html>
